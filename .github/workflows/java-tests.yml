name: Java API Tests (RestAssured)
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests with Maven
        run: mvn test
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          BASE_URL: ${{ secrets.BASE_URL }}
          EXPECTED_PROFILE_ID: ${{ secrets.EXPECTED_PROFILE_ID }}
          EXPECTED_FIRST_NAME: ${{secrets.EXPECTED_FIRST_NAME}}
          EXPECTED_LAST_NAME: ${{secrets.EXPECTED_LAST_NAME}}
          INVALID_TOKEN: ${{secrets.INVALID_TOKEN}}
          BALANCE_ID_AUD: ${{ secrets.BALANCE_ID_AUD }}
          BALANCE_ID_EUR: ${{ secrets.BALANCE_ID_EUR }}
          BALANCE_ID_GBP: ${{ secrets.BALANCE_ID_GBP }}
          BALANCE_ID_NA: ${{ secrets.BALANCE_ID_NA }}
          BALANCE_ID_HUF: ${{ secrets.BALANCE_ID_HUF }}
          BALANCE_ID_USD: ${{ secrets.BALANCE_ID_USD }}
          QUOTE_ID_INSUFFICIENT: ${{ secrets.QUOTE_ID_INSUFFICIENT }}
      - name: Generate Allure Report
        if: always()
        run: |
          mvn allure:report

      - name: Upload Allure Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: full-allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 45