name: Java API Tests (RestAssured)
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests with Maven
        run: mvn test
        env:
          WISE_API_TOKEN: ${{ secrets.WISE_API_TOKEN }}
          WISE_BASE_URL: ${{ secrets.WISE_BASE_URL }}
          EXPECTED_PROFILE_ID: ${{ secrets.EXPECTED_PROFILE_ID }}
          EXPECTED_FIRST_NAME: ${{secrets.EXPECTED_FIRST_NAME}}
          EXPECTED_LAST_NAME: ${{secrets.EXPECTED_LAST_NAME}}
          INVALID_TOKEN: ${{secrets.INVALID_TOKEN}}
          BALANCE_ID_AUD: ${{ secrets.BALANCE_ID_AUD }}
          BALANCE_ID_EUR: ${{ secrets.BALANCE_ID_EUR }}
          BALANCE_ID_GBP: ${{ secrets.BALANCE_ID_GBP }}
          BALANCE_ID_USD: ${{ secrets.BALANCE_ID_USD }}
          BALANCE_ID_HUF: ${{ secrets.BALANCE_ID_HUF }}

      - name: Generate Allure Report
        if: always()
        run: |
          mvn allure:report

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 45